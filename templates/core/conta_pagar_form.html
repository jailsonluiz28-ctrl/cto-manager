{% extends "base.html" %}
{% block titulo %}Nova conta a pagar{% endblock %}
{% block conteudo %}
<div class="card p-4" style="max-width:500px;">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3"><label class="form-label small">{{ field.label }}</label>{{ field }}</div>
    {% endfor %}
    <div class="d-flex gap-2 justify-content-end">
      <a href="{% url 'financeiro' %}" class="btn btn-outline-secondary">Cancelar</a>
      <button class="btn btn-primary" type="submit">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}
