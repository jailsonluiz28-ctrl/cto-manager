{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema indisponível</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b1220; padding: 24px 16px; }
  .cartao { background: #fff; border-radius: 18px; padding: 40px 34px; max-width: 460px; text-align: center; box-shadow: 0 20px 45px rgba(0,0,0,.35); }
  .icone { width: 64px; height: 64px; border-radius: 50%; background: #fef2f2; color: #dc2626; display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 18px; }
</style>
</head>
<body>
  <div class="cartao">
    <div class="icone"><i class="bi bi-lock-fill"></i></div>
    <h4 class="fw-bold mb-2">Sistema temporariamente indisponível</h4>
    <p class="text-muted mb-0">
      {% if licenca.mensagem_bloqueio %}{{ licenca.mensagem_bloqueio }}{% else %}Entre em contato com o suporte responsável pelo sistema pra regularizar o acesso.{% endif %}
    </p>
  </div>
</body>
</html>
