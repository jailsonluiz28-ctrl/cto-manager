{% extends "base.html" %}
{% block titulo %}Excluir Débito Congelado{% endblock %}
{% block conteudo %}
<div class="card p-4" style="max-width:500px;">
  <p>Excluir o débito congelado <strong>"{{ debito.descricao }}"</strong> (R$ {{ debito.valor|floatformat:2 }})?</p>
  <form method="post">
    {% csrf_token %}
    <div class="d-flex justify-content-end gap-2">
      <a href="{% url 'debitos_congelados' %}" class="btn btn-outline-secondary">Cancelar</a>
      <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Excluir</button>
    </div>
  </form>
</div>
{% endblock %}
