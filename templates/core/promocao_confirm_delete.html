{% extends "base.html" %}
{% block titulo %}Excluir Promoção{% endblock %}
{% block conteudo %}
<div class="card p-4" style="max-width:480px;">
  <p>Tem certeza que quer excluir a promoção <strong>"{{ promocao.titulo }}"</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <div class="d-flex gap-2 justify-content-end">
      <a href="{% url 'promocao_list' %}" class="btn btn-outline-secondary">Cancelar</a>
      <button class="btn btn-danger" type="submit">Excluir</button>
    </div>
  </form>
</div>
{% endblock %}
