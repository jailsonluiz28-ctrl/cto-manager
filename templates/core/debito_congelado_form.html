{% extends "base.html" %}
{% block titulo %}Novo Débito Congelado{% endblock %}
{% block conteudo %}
<div class="card p-4" style="max-width:550px;">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
      <label class="form-label small">{{ field.label }}</label>{{ field }}
      {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
    </div>
    {% endfor %}
    <div class="d-flex gap-2 justify-content-end">
      <a href="{% url 'debitos_congelados' %}" class="btn btn-outline-secondary">Cancelar</a>
      <button class="btn btn-primary" type="submit">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}
