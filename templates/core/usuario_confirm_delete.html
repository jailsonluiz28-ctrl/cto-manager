{% extends "base.html" %}
{% block titulo %}Excluir usuário{% endblock %}
{% block conteudo %}
<div class="card p-4" style="max-width:600px;">
  <div class="d-flex align-items-start gap-3 mb-3">
    <i class="bi bi-exclamation-triangle-fill text-danger fs-2"></i>
    <div>
      <h5 class="mb-1">Excluir "{{ usuario.get_full_name|default:usuario.username }}"?</h5>
      <p class="text-muted mb-0">Essa pessoa não vai mais conseguir entrar no sistema. Essa ação não pode ser desfeita.</p>
    </div>
  </div>
  <form method="post">
    {% csrf_token %}
    <div class="d-flex justify-content-end gap-2">
      <a href="{% url 'usuario_list' %}" class="btn btn-outline-secondary">Cancelar</a>
      <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Sim, excluir</button>
    </div>
  </form>
</div>
{% endblock %}
