{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Portal do Cliente{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="{% static 'css/estilo.css' %}" rel="stylesheet">
<link rel="manifest" href="{% static 'portal-manifest.json' %}">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portal Cliente">
<link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">
</head>
<body>
{% if messages %}
<div style="position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:2000;width:100%;max-width:420px;padding:0 16px;">
  {% for m in messages %}<div class="alert alert-success shadow-sm">{{ m }}</div>{% endfor %}
</div>
{% endif %}
{% block conteudo %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
